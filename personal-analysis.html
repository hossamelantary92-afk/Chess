<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Game Analysis | رخ</title><style>
*{box-sizing:border-box}body{margin:0;background:#20211e;color:#eee;font:16px system-ui}main{max-width:660px;margin:auto;padding:16px}h1{font-size:25px}p{line-height:1.6;color:#c5c9bd}a,button{color:#e1ebd6}button,a.nav{background:#30382b;border:1px solid #65735a;border-radius:9px;padding:12px;font:inherit;min-height:44px;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}textarea{width:100%;min-height:120px;background:#292c25;color:#eee;border:1px solid #65735a;border-radius:9px;padding:12px;font:16px monospace;direction:ltr}label{display:block;margin:10px 0}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{flex:1}#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;direction:ltr;border:4px solid #42443d;border-radius:8px;overflow:hidden}.sq{position:relative;display:grid;place-items:center;min-width:0}.sq img{width:90%;height:90%;object-fit:contain}.sq small{position:absolute;bottom:1px;left:2px;color:#222;font-size:10px}.sq.last{box-shadow:inset 0 0 0 4px #d5b84b}#moves{display:flex;flex-wrap:wrap;gap:5px;direction:ltr;max-height:180px;overflow:auto}#moves button{padding:7px 10px;font-size:14px}#moves button[aria-current=true]{background:#69834d}#status{min-height:24px}section[hidden]{display:none}input{max-width:100%;font:inherit}small{color:#b9bdb2}
</style></head><body><main><nav><a class="nav" href="index.html#home">⌂ الرئيسية</a></nav><h1 lang="en" dir="ltr">Personal Game Analysis</h1><p>استورد مباراة واحدة بصيغة PGN وراجع النقلات على الرقعة.</p><label for="pgn">الصق نص PGN</label><textarea id="pgn" spellcheck="false" placeholder="1. e4 e5 2. Nf3 Nc6 ..."></textarea><label for="file">أو اختر ملف PGN</label><input id="file" type="file" accept=".pgn,.txt"><div class="controls"><button id="load">استيراد المباراة</button></div><p id="status" role="status"></p><section id="viewer" hidden><h2 id="players" dir="auto"></h2><p id="meta"></p><div id="board" aria-label="رقعة المباراة"></div><p id="position" dir="ltr"></p><div class="controls"><button id="start">البداية</button><button id="prev">السابق</button><button id="next">التالي</button><button id="end">النهاية</button><button id="flip">اقلب الرقعة</button></div><div id="moves" aria-label="قائمة النقلات"></div><div class="controls"><button id="analyze">حلّل الموقف</button><button id="stopAnalysis">إيقاف التحليل</button></div><p id="evaluation" dir="ltr" role="status"></p><p id="pv" dir="ltr"></p><button id="quality">قيّم النقلة الحالية</button><p id="qualityResult" role="status"></p><small>Stockfish 10 · Depth 12 · التقييم من منظور الأبيض. <a href="https://github.com/niklasf/stockfish.js">المصدر والترخيص GPL-3.0</a></small></section><p><small>التحليل داخل المتصفح، ويحتاج اتصالًا لتحميل المحرك. تصنيف النقلات تقديري وفق عمق التحليل.</small></p></main><script type="module">
import {Chess} from './chess.js';
const $=id=>document.getElementById(id);
let moves=[],initial='',ply=0,flipped=false;
function parse(text){if(!text.trim()||text.length>250000)throw Error('اختر مباراة واحدة بنص صالح لا يتجاوز 250 ألف حرف.');if((text.match(/^\s*\[Event\s/gm)||[]).length>1)throw Error('اختر مباراة واحدة فقط.');const game=new Chess();game.loadPgn(text,{strict:true});const moves=game.history({verbose:true});if(!moves.length)throw Error('لا توجد نقلات في الملف.');return {moves,initial:moves[0].before,headers:game.getHeaders()};}
function render(){const g=new Chess(ply?moves[ply-1].after:initial);const last=moves[ply-1];const board=$('board');board.replaceChildren();const files=flipped?'hgfedcba':'abcdefgh',ranks=flipped?'12345678':'87654321';for(const rank of ranks)for(const file of files){const square=file+rank,p=g.get(square),cell=document.createElement('div');cell.className='sq'+(last&&(last.from===square||last.to===square)?' last':'');cell.style.background=('abcdefgh'.indexOf(file)+Number(rank))%2?'#769656':'#eeeed2';cell.setAttribute('aria-label',square+(p?' '+p.color+p.type:''));if(p){const img=document.createElement('img');img.src='pieces/'+p.color+p.type.toUpperCase()+'.svg';img.alt=p.color+p.type;cell.append(img)}if(file===files[0]||rank===ranks.at(-1)){const label=document.createElement('small');label.textContent=(file===files[0]?rank:'')+(rank===ranks.at(-1)?file:'');cell.append(label)}board.append(cell)}$('position').textContent=ply+' / '+moves.length+' · '+(last?.san||'Start')+' · '+(g.turn()==='w'?'White':'Black')+' to move';$('prev').disabled=$('start').disabled=ply===0;$('next').disabled=$('end').disabled=ply===moves.length;for(const [i,b] of [...$('moves').children].entries())b.setAttribute('aria-current',String(i+1===ply));}
function go(n){resetEngine();ply=Math.max(0,Math.min(moves.length,n));render();showQuality()}
$('load').onclick=()=>{try{const data=parse($('pgn').value);resetEngine();qualityCache.clear();moves=data.moves;initial=data.initial;ply=0;flipped=false;const h=data.headers;$('players').textContent=(h.White||'?')+' — '+(h.Black||'?');$('meta').textContent=[h.Date,h.Result].filter(Boolean).join(' · ');$('moves').replaceChildren();moves.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.before.split(' ')[5]+(m.color==='w'?'. ':'... ')+m.san;b.onclick=()=>go(i+1);$('moves').append(b)});$('viewer').hidden=false;render();$('status').textContent='تم استيراد '+moves.length+' نصف نقلة.'}catch(e){$('status').textContent='تعذر الاستيراد: '+e.message}};
$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>1000000)throw Error('الملف كبير جدًا.');$('pgn').value=await f.text();$('load').click()}catch(e){$('status').textContent=e.message}};
$('start').onclick=()=>go(0);$('prev').onclick=()=>go(ply-1);$('next').onclick=()=>go(ply+1);$('end').onclick=()=>go(moves.length);$('flip').onclick=()=>{flipped=!flipped;render()};

let engine=null, timer=null; let qualityCache=new Map(), qualityRun=0;
function cancelEngine(){if(engine)engine.terminate();engine=null;clearTimeout(timer);$('analyze').disabled=false;}
function resetEngine(){qualityRun++; cancelEngine(); $('quality').disabled=false; $('qualityResult').textContent='';$('evaluation').textContent='';$('pv').textContent='';}
function analyze(){resetEngine();const fen=ply?moves[ply-1].after:initial;const g=new Chess(fen);if(g.isGameOver()){$('evaluation').textContent=g.isCheckmate()?'كش مات':'انتهت المباراة في هذا الموقف';return;}let w;try{w=new Worker('./analysis-worker.js?v=215');}catch(e){$('evaluation').textContent='تعذر تشغيل المحرك';return;}engine=w;$('analyze').disabled=true;$('evaluation').textContent='جاري تحميل المحرك والتحليل…';function fail(){if(engine!==w)return;cancelEngine();$('evaluation').textContent='تعذر تشغيل المحرك. تحقق من الاتصال وحاول مجددًا.';}w.onerror=fail;timer=setTimeout(fail,45000);let latest=null;w.onmessage=({data})=>{if(engine!==w)return;for(const line of String(data).split('\n')){if(line==='uciok')w.postMessage('isready');else if(line==='readyok'){w.postMessage('position fen '+fen);w.postMessage('go depth 12');}else if(line.startsWith('info ')){const score=line.match(/\bscore (cp|mate) (-?\d+)/),depth=line.match(/\bdepth (\d+)/),pv=line.match(/\bpv (.+)/);if(score&&depth&&pv&&!/\b(upperbound|lowerbound)\b/.test(line))latest={score,depth:depth[1],pv:pv[1]};}else if(line.startsWith('bestmove ')){if(!latest){fail();return;}const v=Number(latest.score[2])*(g.turn()==='w'?1:-1);const best=line.split(' ')[1];const board=new Chess(fen);const san=[];try{for(const m of latest.pv.split(/\s+/).slice(0,8)){san.push(board.move({from:m.slice(0,2),to:m.slice(2,4),promotion:m[4]}).san)}}catch{}let bestSan=best;try{bestSan=new Chess(fen).move({from:best.slice(0,2),to:best.slice(2,4),promotion:best[4]}).san}catch{}$('evaluation').textContent=(latest.score[1]==='mate'?'Mate '+(v>0?'+':'')+v:(v>0?'+':'')+(v/100).toFixed(2))+' · Depth '+latest.depth+' · Best: '+bestSan;$('pv').textContent=san.join(' · ');cancelEngine();}}};w.postMessage('uci');}
$('analyze').onclick=analyze;$('stopAnalysis').onclick=()=>{resetEngine();$('evaluation').textContent='تم إيقاف التحليل.';};window.addEventListener('pagehide',cancelEngine);


function showQuality(){const q=qualityCache.get(ply);$('qualityResult').textContent=q?.label||'';}
function evaluateFen(fen, token){return new Promise((resolve,reject)=>{
 const g=new Chess(fen); if(g.isCheckmate()){resolve({value:g.turn()==='w'?-100000:100000,best:''});return;}
 if(g.isGameOver()){resolve({value:0,best:''});return;}
 let w;try{w=new Worker('./analysis-worker.js?v=215')}catch(e){reject(e);return;}
 engine=w;let latest=null;
 const fail=()=>{if(engine===w)cancelEngine();reject(Error('تعذر التحليل'));};
 timer=setTimeout(fail,45000);w.onerror=fail;
 w.onmessage=({data})=>{if(engine!==w||token!==qualityRun)return;
 for(const raw of String(data).split('\n')){const line=raw.trim();
 if(line==='uciok')w.postMessage('isready');
 else if(line==='readyok'){w.postMessage('position fen '+fen);w.postMessage('go depth 12');}
 else if(line.startsWith('info ')){const s=line.match(/\bscore (cp|mate) (-?\d+)/);if(s&&!/\b(upperbound|lowerbound)\b/.test(line)){const n=Number(s[2]);latest=(s[1]==='mate'?Math.sign(n)*(100000-Math.abs(n)):n)*(g.turn()==='w'?1:-1);}}
 else if(line.startsWith('bestmove ')){if(latest===null){fail();return;}const best=line.split(' ')[1];cancelEngine();resolve({value:latest,best});return;}
 }};w.postMessage('uci');
 });}
$('quality').onclick=async()=>{resetEngine();if(!ply){$('qualityResult').textContent='اختر نقلة أولًا';return;}const token=qualityRun,index=ply,m=moves[index-1];$('quality').disabled=true;$('analyze').disabled=true;$('qualityResult').textContent='جاري مقارنة الموقفين…';
try{const before=await evaluateFen(m.before,token);if(token!==qualityRun)return; $('analyze').disabled=true;const after=await evaluateFen(m.after,token);if(token!==qualityRun)return;
const loss=Math.max(0,(before.value-after.value)*(m.color==='w'?1:-1));const actual=m.from+m.to+(m.promotion||'');const best=actual===before.best;const labels=['★ Best Move','✓ Good Move','?! Inaccuracy','? Mistake','?? Blunder'];const colors=['#91c96b','#91c96b','#e1c04f','#ef9a45','#ef6666'];const i=best?0:loss<60?1:loss<120?2:loss<250?3:4;let alternative=before.best;try{alternative=new Chess(m.before).move({from:alternative.slice(0,2),to:alternative.slice(2,4),promotion:alternative[4]}).san}catch{}
const fmt=v=>Math.abs(v)>90000?(v>0?'White mate':'Black mate'):(v/100).toFixed(2);const label=labels[i]+' · '+fmt(before.value)+' → '+fmt(after.value)+' · Best: '+alternative;qualityCache.set(index,{label});const b=$('moves').children[index-1];b.style.color=colors[i];b.textContent=b.textContent.split(' · ')[0]+' · '+labels[i].split(' ')[0];showQuality();
}catch(e){if(token===qualityRun)$('qualityResult').textContent='تعذر التحليل، حاول مجددًا.';}finally{if(token===qualityRun){$('quality').disabled=false;$('analyze').disabled=false;}}};
</script></body></html>
