<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Game Analysis | رخ</title><style>
*{box-sizing:border-box}body{margin:0;background:#20211e;color:#eee;font:16px system-ui}main{max-width:660px;margin:auto;padding:16px}h1{font-size:25px}p{line-height:1.6;color:#c5c9bd}a,button{color:#e1ebd6}button,a.nav{background:#30382b;border:1px solid #65735a;border-radius:9px;padding:12px;font:inherit;min-height:44px;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}textarea{width:100%;min-height:120px;background:#292c25;color:#eee;border:1px solid #65735a;border-radius:9px;padding:12px;font:16px monospace;direction:ltr}label{display:block;margin:10px 0}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{flex:1}#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;direction:ltr;border:4px solid #42443d;border-radius:8px;overflow:hidden}.sq{position:relative;display:grid;place-items:center;min-width:0}.sq img{width:90%;height:90%;object-fit:contain}.sq small{position:absolute;bottom:1px;left:2px;color:#222;font-size:10px}.sq.last{box-shadow:inset 0 0 0 4px #d5b84b}#moves{display:flex;flex-wrap:wrap;gap:5px;direction:ltr;max-height:180px;overflow:auto}#moves button{padding:7px 10px;font-size:14px}#moves button[aria-current=true]{background:#69834d}#status{min-height:24px}section[hidden]{display:none}input{max-width:100%;font:inherit}small{color:#b9bdb2}
</style></head><body><main><nav><a class="nav" href="index.html#home">⌂ الرئيسية</a></nav><h1 lang="en" dir="ltr">Personal Game Analysis</h1><p>استورد مباراة واحدة بصيغة PGN وراجع النقلات على الرقعة.</p><label for="pgn">الصق نص PGN</label><textarea id="pgn" spellcheck="false" placeholder="1. e4 e5 2. Nf3 Nc6 ..."></textarea><label for="file">أو اختر ملف PGN</label><input id="file" type="file" accept=".pgn,.txt"><div class="controls"><button id="load">استيراد المباراة</button></div><p id="status" role="status"></p><section id="viewer" hidden><h2 id="players" dir="auto"></h2><p id="meta"></p><div id="board" aria-label="رقعة المباراة"></div><p id="position" dir="ltr"></p><div class="controls"><button id="start">البداية</button><button id="prev">السابق</button><button id="next">التالي</button><button id="end">النهاية</button><button id="flip">اقلب الرقعة</button></div><div id="moves" aria-label="قائمة النقلات"></div></section><p><small>المراجعة محلية داخل المتصفح. لا يوجد تقييم محرك أو تصنيف أخطاء تلقائي في هذه النسخة.</small></p></main><script type="module">
import {Chess} from './chess.js';
const $=id=>document.getElementById(id);
let moves=[],initial='',ply=0,flipped=false;
function parse(text){if(!text.trim()||text.length>250000)throw Error('اختر مباراة واحدة بنص صالح لا يتجاوز 250 ألف حرف.');if((text.match(/^\s*\[Event\s/gm)||[]).length>1)throw Error('اختر مباراة واحدة فقط.');const game=new Chess();game.loadPgn(text,{strict:true});const moves=game.history({verbose:true});if(!moves.length)throw Error('لا توجد نقلات في الملف.');return {moves,initial:moves[0].before,headers:game.getHeaders()};}
function render(){const g=new Chess(ply?moves[ply-1].after:initial);const last=moves[ply-1];const board=$('board');board.replaceChildren();const files=flipped?'hgfedcba':'abcdefgh',ranks=flipped?'12345678':'87654321';for(const rank of ranks)for(const file of files){const square=file+rank,p=g.get(square),cell=document.createElement('div');cell.className='sq'+(last&&(last.from===square||last.to===square)?' last':'');cell.style.background=('abcdefgh'.indexOf(file)+Number(rank))%2?'#769656':'#eeeed2';cell.setAttribute('aria-label',square+(p?' '+p.color+p.type:''));if(p){const img=document.createElement('img');img.src='pieces/'+p.color+p.type.toUpperCase()+'.svg';img.alt=p.color+p.type;cell.append(img)}if(file===files[0]||rank===ranks.at(-1)){const label=document.createElement('small');label.textContent=(file===files[0]?rank:'')+(rank===ranks.at(-1)?file:'');cell.append(label)}board.append(cell)}$('position').textContent=ply+' / '+moves.length+' · '+(last?.san||'Start')+' · '+(g.turn()==='w'?'White':'Black')+' to move';$('prev').disabled=$('start').disabled=ply===0;$('next').disabled=$('end').disabled=ply===moves.length;for(const [i,b] of [...$('moves').children].entries())b.setAttribute('aria-current',String(i+1===ply));}
function go(n){ply=Math.max(0,Math.min(moves.length,n));render()}
$('load').onclick=()=>{try{const data=parse($('pgn').value);moves=data.moves;initial=data.initial;ply=0;flipped=false;const h=data.headers;$('players').textContent=(h.White||'?')+' — '+(h.Black||'?');$('meta').textContent=[h.Date,h.Result].filter(Boolean).join(' · ');$('moves').replaceChildren();moves.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.before.split(' ')[5]+(m.color==='w'?'. ':'... ')+m.san;b.onclick=()=>go(i+1);$('moves').append(b)});$('viewer').hidden=false;render();$('status').textContent='تم استيراد '+moves.length+' نصف نقلة.'}catch(e){$('status').textContent='تعذر الاستيراد: '+e.message}};
$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>1000000)throw Error('الملف كبير جدًا.');$('pgn').value=await f.text();$('load').click()}catch(e){$('status').textContent=e.message}};
$('start').onclick=()=>go(0);$('prev').onclick=()=>go(ply-1);$('next').onclick=()=>go(ply+1);$('end').onclick=()=>go(moves.length);$('flip').onclick=()=>{flipped=!flipped;render()};
</script></body></html>
