;if(!matchMode)return;const seconds=Number($('matchLimit').value);$('matchLimit').disabled=i>0;$('matchTime').textContent=seconds?seconds+' ثانية':'بدون مؤقت';if(!seconds)return;deadline=startedAt+seconds*1000;clock=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-performance.now())/1000));$('matchTime').textContent=left+' ثانية';if(!left&&!locked){stopClock();times.push(seconds);answers.push('Timeout');locked=true;selected=null;$('promote').hidden=true;$('status').textContent='انتهى الوقت';$('next').disabled=false;draw()}},100)}$('matchLimit').onchange=()=>{if(matchMode&&!locked&&i===0)startClock()};function open(){b=new Chess(bank[i][1]);side=b.turn();selected=null;locked=false;$('counter').textContent=(i+1)+' / '+bank.length+(matchMode?'':' · '+bank[i][0]+' · '+bank[i][5]);$('progress').value=i;$('prompt').textContent=matchMode?'افحص الموقف واختر أقوى نقلة متاحة.':bank[i][3];$('turn').textContent=side==='w'?'الأبيض يلعب':'الأسود يلعب';$('next').disabled=true;$('status').textContent='';$('promote').hidden=true;draw();startClock()}function draw(){const board=$('board');board.replaceChildren();for(const rank of side==='w'?'87654321':'12345678')for(const file of side==='w'?'abcdefgh':'hgfedcba'){const sq=file+rank,p=b.get(sq),btn=document.createElement('button');btn.className=(('abcdefgh'.indexOf(file)+Number(rank))%2?'dark':'')+(selected===sq?' selected':'');btn.disabled=locked;btn.setAttribute('aria-label',sq+(p?' '+p.color+p.type:''));if(p){const img=document.createElement('img');img.src='pieces/'+p.color+p.type.toUpperCase()+'.svg';img.alt='';btn.append(img)}const label=document.createElement('small');label.textContent=sq;btn.append(label);btn.onclick=()=>choose(sq);board.append(btn)}}function choose(sq){if(locked)return;$('promote').hidden=true;if(b.get(sq)?.color===side){selected=sq===selected?null:sq;draw();return}if(!selected)return;const moves=b.moves({square:selected,verbose:true}).filter(m=>m.to===sq);if(!moves.length){$('status').textContent='نقلة غير قانونية';return}if(moves.length===1){play(moves[0].san);return}const box=$('promote');box.replaceChildren();for(const m of moves){const btn=document.createElement('button');btn.textContent=m.promotion.toUpperCase();btn.onclick=()=>play(m.san);box.append(btn)}box.hidden=false}function play(san){if(locked)return;if(matchMode&&Number($('matchLimit').value)&&performance.now()>=deadline){return}stopClock();if(matchMode)times.push((performance.now()-startedAt)/1000);b.move(san);answers.push(san);locked=true;selected=null;$('promote').hidden=true;$('status').textContent='تم تسجيل النقلة: '+san;$('next').disabled=false;draw()}function completeDaily(id,expected){try{const d=new Date(),key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const all=JSON.parse(localStorage.getItem('rook-daily-training-v1')||'{}'),e=all[key];if(!e||!Array.isArray(e.tasks)||!e.tasks.some(t=>t.id===id&&t.href===expected))return false;e.done=Array.isArray(e.done)?e.done:[];if(!e.done.includes(id))e.done.push(id);localStorage.setItem('rook-daily-training-v1',JSON.stringify(all));return true}catch{return false}}function finish(){stopClock();$('quiz').hidden=true;$('result').hidden=false;let score=0;const skills={};$('review').replaceChildren();bank.forEach((q,n)=>{const ok=q[2].includes(answers[n]);skills[q[0]]??={correct:0,total:0};skills[q[0]].total++;if(ok){score++;skills[q[0]].correct++;}const p=document.createElement('p');p.textContent=q[0]+' · '+(ok?'✓':'✗')+' · نقلتك: '+answers[n]+' · '+q[4]+' · المقبول: '+q[2].join(', ');$('review').append(p)});$('score').textContent=score+'/'+bank.length;const summary=document.createElement('p');summary.textContent=Object.entries(skills).map(([k,v])=>k+': '+v.correct+'/'+v.total).join(' · ');$('review').prepend(summary);if(matchMode){$('comparison').textContent='جلسة مستقلة لا تغيّر سجل التقييم. الحلول مواقف مات في نقلة. متوسط زمن المحاولة: '+(times.reduce((a,b)=>a+b,0)/Math.max(1,times.length)).to
