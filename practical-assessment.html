<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُخ | Practical Assessment</title><link rel="stylesheet" href="style.css?v=32"><link rel="stylesheet" href="club.css?v=61"><style>main{max-width:650px;margin:auto;padding:16px}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,480px);aspect-ratio:1;margin:16px auto;direction:ltr}#board button{padding:0;border:0;border-radius:0;min-width:0;aspect-ratio:1;position:relative;background:#ebecd0}#board button.dark{background:#779556}#board button.selected{outline:3px solid #e8b84b;outline-offset:-3px}#board img{width:90%;height:90%;object-fit:contain}#board small{position:absolute;bottom:1px;left:2px;color:#222;font-size:9px}#promote{display:flex;gap:8px;flex-wrap:wrap}[hidden]{display:none!important}progress{width:100%}</style></head><body><header><a class="brand" href="index.html">♜ رُخ</a></header><main><a href="assessment.html">التقييم النظري</a><h1 dir="ltr">Practical Assessment</h1><p>18 موقفًا · 3 مستويات · محاولة واحدة لكل موقف · لا تلميحات · ليس تقييم Elo.</p><section id="quiz"><p id="counter"></p><progress id="progress" max="18"></progress><h3 id="prompt"></h3><p id="turn"></p><div id="board"></div><div id="promote" hidden></div><p id="status" role="status"></p><button id="next" class="primary" disabled>الموقف التالي</button></section><section id="result" hidden><h2 id="score"></h2><div id="review"></div><button id="again" class="primary">إعادة الاختبار</button></section></main><script type="module">import {Chess} from './chess.js';const bank=[["Opening","rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq d3 0 1",["d5","Nf6","f5","e6","c5","g6","d6","c6"],"اختر ردًا افتتاحيًا معروفًا على d4.","توجد ردود افتتاحية أخرى؛ هذه مجموعة مقبولة.","Basic"],["Tactics","4k3/8/8/3q4/8/4N3/8/4K3 w - - 0 1",["Nxd5"],"اكسب الوزير غير المحمي.","افحص الأخذ المباشر قبل البحث عن تكتيك معقد.","Basic"],["Calculation","6k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1",["Re8#"],"ابحث عن مات في نقلة.","الصف الخلفي مغلق ببيادق الملك.","Basic"],["Middlegame","6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1",["Ra7"],"ضع الرخ على الصف السابع.","الرخ يضغط على بيادق الصف السابع.","Basic"],["Endgame","8/4P3/4K3/8/8/8/8/7k w - - 0 1",["e8=Q","e8=R"],"رقّ البيدق إلى قطعة تكفي للفوز.","الوزير والرخ يكفيان للمات مع الملك.","Basic"],["Defense","7k/8/8/8/8/8/1p6/1R5K w - - 0 1",["Rxb2"],"أوقف البيدق المار بالأخذ المباشر.","إزالة البيدق تمنع الترقية.","Basic"],["Opening","rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1",["e5","c5","e6","c6","d5","Nf6","d6","g6","Nc6"],"اختر ردًا افتتاحيًا معروفًا على e4.","الردود المقبولة تمثل افتتاحيات معروفة؛ ليست قائمة بكل النقلات الممكنة.","Intermediate"],["Tactics","7k/8/8/8/3r4/8/5Q2/6K1 w - - 0 1",["Qf6+"],"نفّذ كشًا يهاجم الرخ في الوقت نفسه.","Qf6+ يهاجم الملك والرخ على القطر.","Intermediate"],["Calculation","7k/5K2/8/6Q1/8/8/8/8 w - - 0 1",["Qg7#","Qg8#","Qh6#","Qh5#","Qh4#"],"ابحث عن كش مات في نقلة واحدة.","احسب مربعات هروب الملك.","Intermediate"],["Middlegame","r5k1/5ppp/8/8/8/8/5PPP/1R4K1 w - - 0 1",["Rb7"],"نشّط الرخ على الصف السابع.","Rb7 يضغط على بيادق الخصم من الجانب.","Intermediate"],["Endgame","8/k1P5/2K5/8/8/8/8/8 w - - 0 1",["c8=R"],"رقّ البيدق مع تجنب الردب والحفاظ على إمكانية الفوز.","الوزير يؤدي للردب؛ الرخ يفوز.","Intermediate"],["Defense","7k/P7/2n5/8/8/8/8/7K b - - 0 1",["Nxa7"],"أوقف الترقية وحقق تعادلًا فوريًا.","أخذ البيدق يترك حصانًا ضد ملك.","Intermediate"],["Opening","rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2",["Nc6","Nf6","d6"],"اختر ردًا من الدفاعات المعروفة في هذا الوضع.","Nc6 أو Nf6 أو d6 ردود افتتاحية معروفة.","Advanced"],["Tactics","7k/8/8/8/2r5/8/4Q3/6K1 w - - 0 1",["Qe5+"],"ابحث عن فرصة تكتيكية.","الوزير يهاجم الملك والرخ على قطرين.","Advanced"],["Calculation","7k/6pp/8/8/8/8/5PPP/4R1K1 w - - 0 1",["Re8#"],"احسب نقلة تحسم المباراة فورًا.","افحص جميع مربعات هروب الملك.","Advanced"],["Middlegame","6k1/5ppp/8/8/8/8/5PPP/2R3K1 w - - 0 1",["Rc7"],"اختر نقلة تضع الرخ على صف بيادق الخصم.","Rc7 ينشط الرخ على الصف السابع.","Advanced"],["Endgame","8/8/8/8/8/2k5/K1p5/8 b - - 0 1",["c1=R"],"اختر ترقية تحافظ على الفوز دون ردب.","الترقية إلى رخ تتجنب الردب.","Advanced"],["Defense","7k/8/8/8/8/8/2p5/2R4K w - - 0 1",["Rxc2"],"أزل خطر الترقية.","أخذ البيدق يزيل التهديد.","Advanced"]];const $=id=>document.getElementById(id);let i=0,b,side,selected,locked,answers=[];function open(){b=new Chess(bank[i][1]);side=b.turn();selected=null;locked=false;$('counter').textContent=(i+1)+' / '+bank.length+' · '+bank[i][0]+' · '+bank[i][5];$('progress').value=i;$('prompt').textContent=bank[i][3];$('turn').textContent=side==='w'?'الأبيض يلعب':'الأسود يلعب';$('next').disabled=true;$('status').textContent='';$('promote').hidden=true;draw()}function draw(){const board=$('board');board.replaceChildren();for(const rank of side==='w'?'87654321':'12345678')for(const file of side==='w'?'abcdefgh':'hgfedcba'){const sq=file+rank,p=b.get(sq),btn=document.createElement('button');btn.className=(('abcdefgh'.indexOf(file)+Number(rank))%2?'dark':'')+(selected===sq?' selected':'');btn.disabled=locked;btn.setAttribute('aria-label',sq+(p?' '+p.color+p.type:''));if(p){const img=document.createElement('img');img.src='pieces/'+p.color+p.type.toUpperCase()+'.svg';img.alt='';btn.append(img)}const label=document.createElement('small');label.textContent=sq;btn.append(label);btn.onclick=()=>choose(sq);board.append(btn)}}function choose(sq){if(locked)return;$('promote').hidden=true;if(b.get(sq)?.color===side){selected=sq===selected?null:sq;draw();return}if(!selected)return;const moves=b.moves({square:selected,verbose:true}).filter(m=>m.to===sq);if(!moves.length){$('status').textContent='نقلة غير قانونية';return}if(moves.length===1){play(moves[0].san);return}const box=$('promote');box.replaceChildren();for(const m of moves){const btn=document.createElement('button');btn.textContent=m.promotion.toUpperCase();btn.onclick=()=>play(m.san);box.append(btn)}box.hidden=false}function play(san){if(locked)return;b.move(san);answers.push(san);locked=true;selected=null;$('promote').hidden=true;$('status').textContent='تم تسجيل النقلة: '+san;$('next').disabled=false;draw()}function finish(){$('quiz').hidden=true;$('result').hidden=false;let score=0;const skills={};$('review').replaceChildren();bank.forEach((q,n)=>{const ok=q[2].includes(answers[n]);skills[q[0]]??={correct:0,total:0};skills[q[0]].total++;if(ok){score++;skills[q[0]].correct++;}const p=document.createElement('p');p.textContent=q[0]+' · '+(ok?'✓':'✗')+' · نقلتك: '+answers[n]+' · '+q[4]+' · المقبول: '+q[2].join(', ');$('review').append(p)});$('score').textContent=score+'/'+bank.length;const summary=document.createElement('p');summary.textContent=Object.entries(skills).map(([k,v])=>k+': '+v.correct+'/'+v.total).join(' · ');$('review').prepend(summary);try{localStorage.setItem('rook-practical-assessment-v1',JSON.stringify({score,skills,answers,date:new Date().toISOString()}))}catch{}}$('next').onclick=()=>{i++;i===bank.length?finish():open()};$('again').onclick=()=>{i=0;answers=[];$('result').hidden=true;$('quiz').hidden=false;open()};open();</script></body></html>
