<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رُخ | Assessment</title><link rel="stylesheet" href="style.css?v=32"><link rel="stylesheet" href="club.css?v=61"><style>main{max-width:760px;margin:auto;padding:16px} .assessment{padding:20px;margin:16px 0;border:1px solid #7775;border-radius:16px} .answers{display:grid;gap:10px}.answers button{white-space:normal;text-align:right;padding:14px;min-height:48px} progress{width:100%;accent-color:#81a65c} .score-row{display:grid;grid-template-columns:100px 1fr 48px;gap:12px;align-items:center;margin:14px 0} [hidden]{display:none!important}.coach-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 20px;direction:rtl}.coach-nav a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px;border:1px solid #8886;border-radius:10px;font-size:.85rem;text-decoration:none}.coach-nav a[aria-current=page]{background:#779556;color:#fff;font-weight:700}@media(max-width:380px){.coach-nav{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><a class="brand" href="index.html">♜ رُخ</a></header><main><nav class="coach-nav" aria-label="أقسام المدرب"><a href="personal-coach.html">المدرب</a><a href="practical-assessment.html">عملي</a><a href="assessment.html" aria-current="page">نظري</a><a href="performance-dashboard.html">الأداء</a></nav><h1 lang="en" dir="ltr">Chess Assessment</h1><p>اختبار معرفة مبدئي · 18 سؤالًا · 6 مهارات. ليس تقييم Elo.</p><section class="assessment" id="start"><p id="previous"></p><button class="primary" id="begin">ابدأ التقييم</button></section><section class="assessment" id="quiz" hidden><p id="counter"></p><progress id="progress" max="18" value="0"></progress><h3 id="question"></h3><div class="answers" id="answers"></div></section><section class="assessment" id="result" hidden><h2>نتيجة التقييم</h2><h3 id="total"></h3><div id="scores"></div><p id="recommend"></p><div id="links"></div><details><summary>مراجعة الإجابات</summary><div id="review"></div></details><button class="primary" id="again">إعادة الاختبار</button></section></main><script>const bank=[["Opening","في بداية المباراة، أي هدف له الأولوية عادة؟",["تحريك الوزير عدة مرات","السيطرة على المركز وتطوير القطع","دفع كل بيادق الجناح"],1,"التطوير والمركز يساعدان على أمان الملك."],["Opening","بعد رد غير متوقع من الخصم، ماذا تفعل؟",["تفحص تهديده وتختار نقلة مناسبة","تكرر الخط المحفوظ دون حساب","تضحي بقطعة فورًا"],0,"افهم الوضع بدل حفظ النقلات فقط."],["Opening","ما الهدف المعتاد من التبييت؟",["ترقية بيدق","منع كل الكشات","أمان الملك وتنشيط الرخ"],2,"التبييت يجمع بين الأمان والتطوير."],["Tactics","قطعة واحدة تهاجم قطعتين في وقت واحد. ما الاسم؟",["Fork","Opposition","Fortress"],0,"الهجوم المزدوج يسمى Fork."],["Tactics","قطعة لا تستطيع التحرك لأن ملكها سينكشف للكش. ما الحالة؟",["Skewer","Absolute pin","Discovered attack"],1,"التثبيت المطلق يمنع النقلة قانونيًا."],["Tactics","ما أول ما تفحصه عند البحث عن تكتيك؟",["لون المربعات فقط","عدد النقلات السابقة","الكشات والأخذ والتهديدات"],2,"النقلات الإجبارية مرشحات مهمة."],["Calculation","بعد اقتراح تضحية، ما الخطوة التالية؟",["احسب أقوى رد للخصم","افترض أنه سيقبلها","احسب نقلاتك وحدها"],0,"الحساب يشمل أفضل دفاع."],["Calculation","لو حسبت خطًا ينتهي بكسب رخ لكن ملكك في كش مات؟",["الخط رابح","الخط خاسر","الخط تعادل"],1,"المات يحسم المباراة بغض النظر عن المادة."],["Calculation","قبل تنفيذ نقلة حسبتها، ما الفحص الأخير؟",["تغيير الافتتاحية","تقييم سرعة الخصم فقط","الكشات والأخذ والتهديدات بعد نقلتك"],2,"افحص الأخطاء المباشرة قبل الالتزام."],["Middlegame","أين ينشط الرخ عادة؟",["عمود مفتوح يمكن دخوله بأمان","خلف قطع محاصرة دائمًا","أي مربع دون اعتبار للوضع"],0,"العمود المفتوح يزيد نشاط الرخ."],["Middlegame","ما معنى Outpost للحصان؟",["مربع ترقية","مربع قوي يصعب طرده ببيدق","مربع يجب تركه فورًا"],1,"المربع المتقدم المستقر يدعم نشاط الحصان."],["Middlegame","إذا لم توجد فرصة تكتيكية واضحة؟",["ضحّ بالوزير","حرّك قطعة عشوائيًا","حسّن أقل قطعك نشاطًا"],2,"تحسين القطع يبني فرصًا مستقبلية."],["Endgame","ملك وفيل ضد ملك فقط، ما النتيجة؟",["تعادل لعدم كفاية المادة","فوز إجباري","خسارة إجباريّة"],0,"لا يمكن تحقيق كش مات بهذه المادة."],["Endgame","في نهاية رخ، أين يفضّل وضع الرخ بالنسبة للبيدق المار غالبًا؟",["أمام ملكك دائمًا","خلف البيدق المار","في زاوية عشوائية"],1,"قاعدة تاراش إرشادية ولها استثناءات."],["Endgame","ملك ليس في كش ولا يملك نقلة قانونية. النتيجة؟",["فوز","خسارة","تعادل بالردب"],2,"الردب ليس كش مات."],["Defense","ملكك في كش. ما الأولوية؟",["إزالة الكش بنقلة قانونية","تهديد الوزير مهما كان","دفع بيدق بعيد"],0,"لا يجوز ترك الملك في كش."],["Defense","عند التأخر ماديًا، ما وسيلة إنقاذ محتملة؟",["التبديل دائمًا","الكش الدائم إذا أمكن فرضه","الاستسلام دائمًا"],1,"الكش الدائم قد يؤدي إلى التكرار."],["Defense","قبل الدفاع عن قطعة مهددة، ماذا تفحص؟",["لون القطعة","عدد الجمهور","إمكان الأخذ أو التهديد المضاد أو الدفاع الآمن"],2,"قارن الردود القانونية والآمنة."]];const $=id=>document.getElementById(id);const links={Opening:'opening-mastery.html',Tactics:'index.html#tactics-lab',Calculation:'index.html#calculation',Middlegame:'index.html#middlegame',Endgame:'index.html#practical-endgames',Defense:'index.html#gameTips'};let i=0,answers=[];function start(){i=0;answers=[];$('start').hidden=true;$('result').hidden=true;$('quiz').hidden=false;show()}function show(){const q=bank[i];$('counter').textContent=(i+1)+' / '+bank.length+' · '+q[0];$('progress').value=i;$('question').textContent=q[1];$('answers').replaceChildren();const order=[0,1,2].sort(()=>Math.random()-.5);for(const n of order){const b=document.createElement('button');b.className='premium-btn';b.textContent=q[2][n];b.onclick=()=>{answers.push(n);i++;i===bank.length?finish():show()};$('answers').append(b)}}function finish(){$('quiz').hidden=true;$('result').hidden=false;const scores={};let total=0;$('review').replaceChildren();bank.forEach((q,n)=>{scores[q[0]]??=0;const correct=answers[n]===q[3];if(correct){scores[q[0]]++;total++}const p=document.createElement('p');p.textContent=(correct?'✓ ':'✗ ')+q[1]+' — '+q[2][q[3]]+' · '+q[4];$('review').append(p)});$('total').textContent=total+' / '+bank.length;$('scores').replaceChildren();for(const [name,n] of Object.entries(scores)){const row=document.createElement('div');row.className='score-row';const label=document.createElement('span');label.textContent=name;const bar=document.createElement('progress');bar.max=3;bar.value=n;const value=document.createElement('span');value.textContent=n+'/3';row.append(label,bar,value);$('scores').append(row)}const min=Math.min(...Object.values(scores));const weak=Object.keys(scores).filter(k=>scores[k]===min);$('recommend').textContent=min===3?'نتيجة ممتازة في المعرفة الأساسية؛ الخطوة التالية اختبار عملي على الرقعة.':'ابدأ بمراجعة المجالات الأقل نتيجة:';$('links').replaceChildren();for(const k of weak){const a=document.createElement('a');a.className='premium-btn';a.style.display='block';a.style.margin='8px 0';a.href=links[k];a.textContent=k;$('links').append(a)}try{localStorage.setItem('rook-assessment-v1',JSON.stringify({total,scores,date:new Date().toISOString()}))}catch{}}$('begin').onclick=start;$('again').onclick=start;try{const p=JSON.parse(localStorage.getItem('rook-assessment-v1'));if(p)$('previous').textContent='آخر نتيجة: '+p.total+'/18'}catch{}</script></body></html>
