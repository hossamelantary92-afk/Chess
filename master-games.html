;const glyph={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};function render(){ $('board').replaceChildren();(game.side==='b'?b.board().slice().reverse().map(row=>row.slice().reverse()):b.board()).forEach((rank,y)=>rank.forEach((p,x)=>{const s='abcdefgh'[game.side==='b'?7-x:x]+(game.side==='b'?y+1:8-y),el=document.createElement('button');el.style.background=(x+y)%2?'#769656':'#eeeed2';el.className=(p?.color==='w'?'white ':'')+(selected===s?'selected':'');el.textContent=p?glyph[p.type]:'';el.setAttribute('aria-label',s+(p?' '+p.color+p.type:''));el.onclick=()=>pick(s);$('board').append(el)}));$('status').textContent=ply===moves.length?game.result:mode==='test'&&ply%2===target()?'توقع نقلة '+game.name+' · '+(Math.floor(ply/2)+1):'النقلة '+ply+' / '+moves.length;$('note').textContent=feedback||(ply?moves[ply-1]+' — '+(notes[ply-1]||'تابع تطور الموقف.'):'ابدأ من الوضع الأول.');$('next').disabled=ply===moves.length;$('prev').disabled=!ply;}function step(){if(ply<moves.length)b.move(moves[ply++]);selected=null;}function next(){feedback='';step();if(mode==='test'&&ply%2!==target())step();render()}function pick(s){if(mode!=='test'||ply%2!==target()||ply>=moves.length)return;const p=b.get(s);if(p?.color===(game.side||'w')){selected=s;render();return}if(!selected)return;let m;try{m=b.move({from:selected,to:s,promotion:'q'})}catch{}if(!m){feedback='نقلة غير قانونية';selected=null;render();return}b.undo();if(m.san===moves[ply]){const n=notes[ply]||'';step();step();feedback='أحسنت! '+m.san+' '+n}else{feedback='ليست نقلة الأستاذ التاريخية. جرّب مرة أخرى.';selected=null}render()}$('next').onclick=next;$('prev').onclick=()=>{feedback='';if(ply){b.undo();ply--}if(mode==='test'&&ply>0&&ply%2!==target()){b.undo();ply--}selected=null;render()};$('reset').onclick=()=>{b.reset();ply=0;selected=null;feedback='';if(mode==='test'&&target())step();render()};$('view').onclick=()=>{mode='view';feedback='';render()};$('test').onclick=()=>{mode='test';feedback='';if(ply%2!==target())step();render()};funct
